[package]
name = "rabbit-auto"
version = "0.7.0"
authors = ["Anicka Burova <anicka.burova@gmail.com>"]
edition = "2018"
license = "MIT"
description = "Wrappers for lapin publishers and consumers"
repository = "https://github.com/AnickaBurova/rabbit_auto"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
humantime = ["humantime_library"]
chrono = ["chrono_library"]

[dependencies]
anyhow = "1.0.100"
futures = "0.3.31"
lapin = "3.7.2"
lazy_static = "1.5.0"
log = "0.4.29"
nom = "8.0.0"
tokio = { version = "1.49.0", features = ["rt", "time", "sync", "macros"] }
# executor-trait = "2.1.2"
# reactor-trait = "2.8.0"
pinky-swear = "6.2.1"
async-trait = "0.1.89"
humantime_library = { package = "humantime", version = "2.3.0", optional = true }
chrono_library = { package = "chrono", version = "0.4.43", optional = true }
async-rs = "0.8.0"
